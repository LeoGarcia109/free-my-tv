<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<title>Free My TV</title>
<link rel="stylesheet" href="home.css">
</head>
<body>
<script>
  // The look the home screen last had, before anything is drawn, so a night start doesn't flash the day one first.
  try {
    if (localStorage.getItem('fmtv.night') === 'true') {
      document.documentElement.style.background = '#0B0B0D';
      document.body.className = 'night';
    }
  } catch (e) {}
</script>
<div id="stage">
  <div id="sky" class="layer">
    <div class="grad day"></div>
    <div class="grad night"></div>
    <canvas id="bgA" width="48" height="27"></canvas>
    <canvas id="bgB" width="48" height="27"></canvas>
    <div class="veil"></div>
    <div class="lift"></div>
  </div>
  <div id="home" class="layer">
    <div id="top" class="layer">
      <h1 id="title"></h1>
      <div id="tabs"></div>
      <div id="quotes"></div>
      <div id="buttons"></div>
      <div id="cards"></div>
      <div id="clock"><span class="time"></span><span class="date"></span></div>
      <div id="whiteboard-view" class="whiteboard-view" style="display: none;">
        <div class="wb-frame">
          <img id="wb-live-img" style="display: none;" alt="Lousa">
          <div id="wb-placeholder" class="wb-placeholder">
            <div class="wb-icon">🎨</div>
            <div class="wb-title">Lousa Mágica da Fernanda</div>
            <div class="wb-sub">Desenhe pelo tablet ou celular acessando no navegador:<br><span class="wb-url">http://192.168.100.120:9120</span></div>
          </div>
          <div class="wb-badge">
            <span class="wb-dot"></span>
            <span>Ao Vivo na TV · 192.168.100.120:9120</span>
          </div>
        </div>
      </div>
      <div id="minimal-view" class="minimal-view" style="display: none;">
        <div id="minimal-photoA" class="minimal-photo"></div>
        <div id="minimal-photoB" class="minimal-photo"></div>
        <div class="minimal-shade"></div>
        <div class="minimal-widget">
          <div id="minimal-time" class="minimal-time">18:30</div>
          <div id="minimal-date" class="minimal-date">Segunda-feira, 26 de Outubro</div>
          <div id="minimal-weather" class="minimal-weather">Ilhéus · 26°C · Céu Limpo</div>
        </div>
      </div>
    </div>
    <div id="family-guard" class="family-guard">
      <div class="family-guard-icon" id="family-guard-icon"></div>
      <div class="family-guard-content">
        <div class="family-guard-title" id="family-guard-title"></div>
        <div class="family-guard-text" id="family-guard-text"></div>
      </div>
      <div class="family-guard-time" id="family-guard-time"></div>
    </div>
    <div id="platter"></div>
    <div id="tiles"></div>
  </div>
  <div id="drawer" class="layer"></div>
  <div id="apps" class="layer sheet"><h2></h2><div class="grid"></div></div>
  <div id="settings" class="layer sheet"><div class="box"></div></div>
  <div id="shelfedit" class="layer sheet"><div class="box"></div></div>
  <div id="langpick" class="layer sheet"><div class="box"></div></div>
  <div id="about" class="layer sheet"><div class="box"></div></div>
  <div id="saver" class="layer"></div>
  <div id="toast"></div>
</div>
<script src="config.js"></script>
<script src="coins.js"></script>
<script src="i18n.js"></script>
<script src="strings.js"></script>
<script src="tv.js"></script>
<script src="zones.js"></script>
<script src="data.js"></script>
<script src="home.js"></script>
</body>
</html>
